# Alembic migration config (Task 2 skeleton).
# NOTE: This file must stay ASCII-only. The alembic CLI parses it with
# configparser using the locale default encoding (GBK on zh-CN Windows),
# so non-ASCII comments here would crash startup.
# The database URL is intentionally NOT hardcoded: env.py builds it at
# runtime from tagplatform.settings.get_settings().database_path, which
# honors the TAGPLT_DATABASE_PATH env var (used by migration tests).

[alembic]
script_location = alembic
# Left blank on purpose: the real URL is injected by env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
