# 影视智能标签平台 nginx 站点配置（Ubuntu，假定部署路径 /opt/tagplatform）。
# 启用方式见 deploy/deploy.md：软链到 /etc/nginx/sites-available/tagplatform
# 并在 sites-enabled 建软链，nginx -t 通过后 reload。
#
# 占位约定：/opt/tagplatform = 部署路径（与 tagplatform.service、deploy.md 一致）；
# server_name 的 "_" = 通配兜底，有域名/固定 IP 时替换为实际值。

server {
    listen 80;
    # 占位：改为实际域名或服务器 IP（如 tagplatform.example.com）
    server_name _;

    # 请求体上限 2g：匹配两类上传端点——Excel 标签库导入（阶段 1）与
    # 视频上传 POST /api/v1/media/upload（阶段 4，后端 2GB 上限）
    client_max_body_size 2g;

    # ---------- 前端静态资源（npm run build 产物 frontend/dist/） ----------
    root /opt/tagplatform/frontend/dist;
    index index.html;

    # SPA history 路由回退：磁盘上不存在的路径一律回 index.html
    location / {
        try_files $uri /index.html;
    }

    # ---------- 后端 API 反代（与 uvicorn 同机同源，前端只写相对路径，无 CORS） ----------
    location /api {
        # 不带 URI 的 proxy_pass：原始 /api/... 路径原样转发到后端
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传时不先在 nginx 落盘缓冲，直接流式转发后端
        proxy_request_buffering off;
        # 放宽读超时：视频 Range 流式播放与慢速导入响应不受 60s 默认值限制
        proxy_read_timeout 300s;
    }
}
