[project]
name = "tagplatform"
version = "0.1.0"
description = "影视智能标签平台——阶段 1：数据底座与导入治理"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    # multipart 表单解析（FastAPI 文件上传路由的硬性依赖，导入接口必需）
    "python-multipart",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "numpy",
    "sentence-transformers",
    "openpyxl",
    # OpenAI 兼容 LLM SDK（懒导入：mock/测试路径不触发 import）
    "openai",
    # make_llm_client 工厂内 load_dotenv 读 .env
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # 该模块的用例断言「空库」行数（治理导入、重嵌入、迁移链），测试夹具
    # 不得预置标签库默认行——见 tests/conftest.py 的 session/client fixture
    "empty_library: 不为该用例预置标签库默认目录/标签",
]
filterwarnings = [
    # starlette 1.10 弃用提示（其 testclient 的 httpx 集成建议迁移 httpx2），
    # 由 fastapi 自身 import 触发，与本项目代码无关，待 fastapi 官方跟进后再处理
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning",
]
